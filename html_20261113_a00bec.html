function updateTranslation(){document.documentElement.lang=language==='en'?'en':'zh-CN';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));modeButtons.forEach((b,i)=>b.querySelector('.mode-label').textContent=t(modeKeys[i]));document.title=t(modeKeys[mode])+' · Luma';$('language').value=language;$('settingsLanguage').value=language;$('power').setAttribute('aria-label',language==='en'?'Power':'电源');$('footerSave').textContent=t(saveState);$('themeButton').setAttribute('aria-label',t('theme'));$('themeMenu').setAttribute('aria-label',t('theme'));document.querySelectorAll('[data-close]').forEach(b=>{if(b.classList.contains('icon-button'))b.setAttribute('aria-label',t('close'))});document.querySelectorAll('[data-open=settingsDialog]').forEach(b=>b.setAttribute('aria-label',t('settings')));document.querySelectorAll('[data-open=deviceDialog]').forEach(b=>b.setAttribute('aria-label',t('device')));$('historyCanvas').setAttribute('aria-label',t('curve'));renderParameters();updatePlaybackState();requestAnimationFrame(updateMarker)}
function updatePlaybackState(){const key=!on?'off':paused?'paused':'running';$('previewStatusText').textContent=t(key);$('previewState').classList.toggle('paused',paused||!on);$('pauseButton').innerHTML=icon(paused?'play':'pause');$('pauseButton').setAttribute('aria-label',t(paused?'resume':'pause'));$('pauseButton').title=t(paused?'resume':'pause');$('pauseButton').setAttribute('aria-pressed',String(paused));$('deviceMode').textContent=t(modeKeys[mode]);$('deviceState').textContent=t(key)}
function setSaveState(value){saveState=value;$('footerSave').textContent=t(value)}
function scheduleSave(){setSaveState('saving');clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(storageKey,JSON.stringify({version:2,language,theme,settings,profiles,mode,on}));storageAvailable=true;setSaveState('saved')}catch{storageAvailable=false;setSaveState('unsaved')}},480)}
function toast(key){clearTimeout(toastTimer);$('toastText').textContent=t(key);$('toast').classList.remove('leaving');$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').classList.add('leaving');setTimeout(()=>$('toast').hidden=true,reduced()?0:210)},2000)}
function selectMode(next){if(next===mode)return;transitionFrom=lastValue;modeTransition=.22;mode=next;phase=0;modeButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===mode)));document.title=t(modeKeys[mode])+' · Luma';renderParameters();updateMarker();updatePlaybackState();animate($('parametersCard'),[{opacity:.5,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:280});scheduleSave()}
function parameterSpecs(){if(mode===0)return [{key:'high',label:'brightness',min:1,max:100,step:1,unit:'%'}];const base=[{key:'high',label:'high',min:1,max:100,step:1,unit:'%'},{key:'low',label:'low',min:0,max:profiles[mode].high-1,step:1,unit:'%'},{key:'period',label:mode===1?'period':mode===3?'heartbeatPeriod':'cycle',min:.4,max:12,step:.05,unit:' s'}];if(mode===2)base.push({key:'duty',label:'onTime',min:10,max:90,step:1,unit:'%'});return base}
function formatParam(spec,value){return (spec.key==='period'?Number(value).toFixed(2):Math.round(value))+spec.unit}
function fillRange(input){const span=Number(input.max)-Number(input.min),pct=span?((Number(input.value)-Number(input.min))/span*100):0;input.style.setProperty('--fill',pct+'%');input.parentElement.style.setProperty('--fill',pct+'%')}
function renderParameters(){const specs=parameterSpecs(),grid=$('parameterGrid');grid.className='parameter-grid'+(specs.length===1?' single':specs.length===2?' two':specs.length===4?' four':'');grid.replaceChildren();specs.forEach(spec=>{const p=document.createElement('div');p.className='parameter';const id='param-'+spec.key;p.innerHTML='<div class="parameter-top"><label for="'+id+'">'+t(spec.label)+'</label><div class="stepper"><button type="button" data-step="-1" aria-label="'+t(spec.label)+' −">−</button><output for="'+id+'"></output><button type="button" data-step="1" aria-label="'+t(spec.label)+' +">+</button></div></div><div class="range-wrap"><input id="'+id+'" type="range" min="'+spec.min+'" max="'+spec.max+'" step="'+spec.step+'" value="'+profiles[mode][spec.key]+'"><span class="range-tip" aria-hidden="true"></span></div>';const input=p.querySelector('input'),out=p.querySelector('output'),tip=p.querySelector('.range-tip');function refresh(){const value=Number(input.value);out.textContent=formatParam(spec,value);tip.textContent=formatParam(spec,value);fillRange(input);input.setAttribute('aria-valuetext',formatParam(spec,value))}input.addEventListener('input',()=>{profiles[mode][spec.key]=Number(input.value);if(spec.key==='high'&&profiles[mode].low>=profiles[mode].high)profiles[mode].low=profiles[mode].high-1;refresh();if(spec.key==='high'){const lo=$('param-low');if(lo){lo.max=String(profiles[mode].high-1);lo.value=profiles[mode].low;lo.closest('.parameter').querySelector('output').textContent=profiles[mode].low+'%';lo.parentElement.querySelector('.range-tip').textContent=profiles[mode].low+'%';lo.setAttribute('aria-valuetext',profiles[mode].low+'%');fillRange(lo)}}updatePeriodText();scheduleSave()});p.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{input.value=String(Number(input.value)+Number(b.dataset.step)*spec.step);input.dispatchEvent(new Event('input',{bubbles:true}));animate(out,[{color:'var(--accent)'},{color:'var(--text)'}],{duration:400})}));grid.append(p);refresh()});updatePeriodText()}
function updatePeriodText(){$('effectFooter').textContent=mode===0?'':profiles[mode].period.toFixed(2)+' s'}
$('power').addEventListener('click',()=>{on=!on;$('power').setAttribute('aria-pressed',String(on));$('power').setAttribute('aria-label',language==='en'?'Power':'电源');updatePlaybackState();scheduleSave()});$('pauseButton').addEventListener('click',()=>{paused=!paused;updatePlaybackState()});
$('resetMode').addEventListener('click',()=>{profiles[mode]=structuredClone(defaults[mode]);renderParameters();scheduleSave();toast('modeReset')});
const systemDark=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const actual=theme==='system'?(systemDark.matches?'dark':'light'):theme;document.documentElement.dataset.theme=actual;$('themeButton').querySelector('use').setAttribute('href','#i-'+(actual==='dark'?'moon':'sun'));document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.themeChoice===theme)));cacheColors();drawHistory()}
function cacheColors(){const css=getComputedStyle(document.documentElement);colors={accent:css.getPropertyValue('--accent').trim(),line:css.getPropertyValue('--line').trim(),fill:css.getPropertyValue('--curve-fill').trim(),surface:css.getPropertyValue('--surface').trim(),muted:css.getPropertyValue('--muted').trim()}}
systemDark.addEventListener('change',()=>{if(theme==='system')applyTheme()});
function closeTheme(focus=false){$('themeMenu').hidden=true;$('themeButton').setAttribute('aria-expanded','false');if(focus)$('themeButton').focus()}
$('themeButton').addEventListener('click',()=>{const open=$('themeMenu').hidden;$('themeMenu').hidden=!open;$('themeButton').setAttribute('aria-expanded',String(open));if(open)$('themeMenu').querySelector('[aria-checked=true]').focus()});document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.themeChoice;applyTheme();closeTheme(true);scheduleSave()}));$('themeMenu').addEventListener('keydown',e=>{const buttons=[...$('themeMenu').querySelectorAll('button')],index=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();buttons[(index+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus()}if(e.key==='Escape'){e.preventDefault();closeTheme(true)}});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.popover-wrap'))closeTheme()});$('railTheme').addEventListener('click',()=>{theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();scheduleSave()});
function setLanguage(next){language=next==='en'?'en':'zh';updateTranslation();scheduleSave();drawHistory()}
$('language').addEventListener('change',e=>setLanguage(e.target.value));$('settingsLanguage').addEventListener('change',e=>setLanguage(e.target.value));
function closeDialog(dialog){if(dialog.classList.contains('closing'))return;if(reduced()){dialog.close();return}dialog.classList.add('closing');setTimeout(()=>{dialog.close();dialog.classList.remove('closing')},170)}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{closeTheme();updatePlaybackState();$(b.dataset.open).showModal()}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeDialog(b.closest('dialog'))));document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('cancel',e=>{e.preventDefault();closeDialog(d)});let downOutside=false;const outside=e=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};d.addEventListener('pointerdown',e=>downOutside=e.target===d&&outside(e));d.addEventListener('click',e=>{if(downOutside&&e.target===d&&outside(e))closeDialog(d);downOutside=false})});
function syncSettings(){$('ambientSetting').checked=settings.ambient;$('gammaSetting').checked=settings.gamma;$('motionSetting').value=settings.motion;document.documentElement.dataset.motion=settings.motion}
$('ambientSetting').addEventListener('change',e=>{settings.ambient=e.target.checked;scheduleSave()});$('gammaSetting').addEventListener('change',e=>{settings.gamma=e.target.checked;scheduleSave()});$('motionSetting').addEventListener('change',e=>{settings.motion=e.target.value;document.documentElement.dataset.motion=settings.motion;scheduleSave()});
$('resetAll').addEventListener('click',()=>{profiles=structuredClone(defaults);mode=1;on=true;paused=false;phase=0;settings={ambient:true,gamma:true,motion:'full'};theme='light';modeButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===mode)));$('power').setAttribute('aria-pressed','true');syncSettings();applyTheme();updateTranslation();updateMarker();history.length=0;lastSample=-1;scheduleSave();toast('resetDone')});
function smooth(x){return x*x*(3-2*x)}
function effectValue(time,p){const profile=profiles[mode],hi=profile.high/100,lo=profile.low/100;let value=0;switch(mode){case 0:return hi;case 1:value=(1-Math.cos(p*TAU))/2;break;case 2:value=p<profile.duty/100?1:0;break;case 3:value=clamp(Math.exp(-(((p-.18)/.045)**2))+.65*Math.exp(-(((p-.4)/.065)**2)),0,1);break}return lo+(hi-lo)*value}
const hc=$('historyCanvas'),hctx=hc.getContext('2d');
function resizeCanvas(canvas,size){const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;size.w=rect.width;size.h=rect.height;size.dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*size.dpr);canvas.height=Math.round(rect.height*size.dpr);canvas.getContext('2d').setTransform(size.dpr,0,0,size.dpr,0,0)}
function resizeHistory(){resizeCanvas(hc,historySize);drawHistory()}
new ResizeObserver(resizeHistory).observe(hc);new ResizeObserver(updateMarker).observe($('modeList'));window.addEventListener('resize',()=>requestAnimationFrame(updateMarker));
function graphPath(ctx,values,start,width,height){let begun=false,previous=null;values.forEach(s=>{const x=(s.t-start)/10*width,y=2+(1-s.v)*(height-4);if(s.breakBefore&&begun){ctx.moveTo(x,y);previous=s;return}if(!begun){ctx.moveTo(x,y);begun=true}else{if(s.hard&&previous)ctx.lineTo(x,2+(1-previous.v)*(height-4));ctx.lineTo(x,y)}previous=s})}
function drawHistory(){const {w,h}=historySize;if(!w||!h)return;hctx.clearRect(0,0,w,h);hctx.strokeStyle=colors.line;hctx.lineWidth=.7;hctx.setLineDash([2,4]);for(const y of [2,h/2,h-2]){hctx.beginPath();hctx.moveTo(0,y);hctx.lineTo(w,y);hctx.stroke()}for(const x of [1,w/2,w-1]){hctx.beginPath();hctx.moveTo(x,0);hctx.lineTo(x,h);hctx.stroke()}hctx.setLineDash([]);if(!history.length)return;const start=simTime-historyWindow;hctx.save();hctx.beginPath();hctx.rect(0,0,w,h);hctx.clip();hctx.beginPath();graphPath(hctx,history,start,w,h);hctx.strokeStyle=colors.accent;hctx.lineWidth=2;hctx.stroke();const last=history[history.length-1],first=history[0];hctx.lineTo((last.t-start)/10*w,h);hctx.lineTo((first.t-start)/10*w,h);hctx.closePath();const gradient=hctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,colors.fill);gradient.addColorStop(1,colors.accent+'00');hctx.fillStyle=gradient;hctx.fill();const lastX=(last.t-start)/10*w,lastY=2+(1-last.v)*(h-4);hctx.beginPath();hctx.arc(lastX,lastY,3,0,TAU);hctx.fillStyle=colors.accent;hctx.fill();if(cursorX!==null){const target=start+cursorX/w*10;let near=history[0];for(const sample of history){if(Math.abs(sample.t-target)<Math.abs(near.t-target))near=sample}const x=(near.t-start)/10*w,y=2+(1-near.v)*(h-4);hctx.strokeStyle=colors.muted;hctx.lineWidth=.8;hctx.setLineDash([3,3]);hctx.beginPath();hctx.moveTo(x,0);hctx.lineTo(x,h);hctx.stroke();hctx.setLineDash([]);hctx.fillStyle=colors.surface;hctx.beginPath();hctx.arc(x,y,4,0,TAU);hctx.fill();hctx.strokeStyle=colors.accent;hctx.lineWidth=2;hctx.stroke();const label=$('cursorLabel');label.textContent=(near.v*100).toFixed(1)+'%';label.style.left=clamp(x+37,37,w-15)+'px';label.classList.add('visible')}hctx.restore()}
hc.addEventListener('pointermove',e=>{const r=hc.getBoundingClientRect();cursorX=clamp(e.clientX-r.left,0,r.width);drawHistory()});hc.addEventListener('pointerleave',()=>{cursorX=null;$('cursorLabel').classList.remove('visible');drawHistory()});
const lightNodes={emitter:$('emitter'),edge:$('emitterEdge'),ambient:$('ambient'),progress:$('phaseProgress'),level:$('levelValue'),raw:$('rawValue')};
let needsHistoryBreak=false;
function frame(ms){requestAnimationFrame(frame);if(document.hidden){lastWall=null;needsHistoryBreak=true;return}const wall=ms/1000,dt=lastWall===null?0:Math.max(0,wall-lastWall);lastWall=wall;if(!paused){simTime+=dt;phase=(phase+dt/profiles[mode].period)%1}const fadeStep=Math.min(dt,.1)/.28;powerLevel+=Math.sign((on?1:0)-powerLevel)*Math.min(Math.abs((on?1:0)-powerLevel),fadeStep);let value=effectValue(simTime,phase);if(modeTransition>0){modeTransition=Math.max(0,modeTransition-dt);const mix=1-modeTransition/.22;value=transitionFrom*(1-smooth(mix))+value*smooth(mix)}value=clamp(value*powerLevel,0,1);lastValue=value;const exposure=(1-Math.exp(-3*value))/(1-Math.exp(-3));lightNodes.emitter.style.opacity=String(exposure);lightNodes.edge.style.opacity=String(exposure*.9);lightNodes.ambient.style.opacity=String(settings.ambient?value:0);lightNodes.progress.style.transform='scaleX('+(mode===0?value:phase)+')';
if(wall-lastNumber>.08){lightNodes.level.textContent=(value*100).toFixed(1);lightNodes.raw.textContent='PWM '+Math.round((settings.gamma?value**2.2:value)*1023)+' / 1023';lastNumber=wall}
if(!paused&&simTime-lastSample>=1/60){history.push({t:simTime,v:value,hard:mode===2,breakBefore:needsHistoryBreak});needsHistoryBreak=false;while(history.length&&history[0].t<simTime-historyWindow-.1)history.shift();lastSample=simTime}
if(wall-lastDraw>=1/60-.001){drawHistory();lastDraw=wall}}
document.addEventListener('visibilitychange',()=>{lastWall=null;needsHistoryBreak=true});
// Seed the chart with the initial effect, so a fresh offline demo is reviewable immediately.
function seedHistory(){const initialPhase=phase,period=profiles[mode].period;for(let i=0;i<=300;i++){const time=-10+i/30,p=((initialPhase+time/period)%1+1)%1;history.push({t:time,v:effectValue(time,p)*(on?1:0),hard:mode===2})}}
syncSettings();applyTheme();updateTranslation();$('power').setAttribute('aria-pressed',String(on));if(!storageAvailable)setSaveState('unsaved');seedHistory();requestAnimationFrame(()=>{updateMarker();resizeHistory();requestAnimationFrame(frame)});
})();
</script>
